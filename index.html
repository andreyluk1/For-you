<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff9ecb" />
  <title>Скучалка 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #ffe4f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(180deg, #ffd6e7 0%, #ffe4f0 45%, #fff5f9 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 14px) 16px 0;
      pointer-events: none;
      z-index: 10;
    }
    .score-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c2185b;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.9);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 230, 242, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    #overlay.hidden { display: none; }
    h1 {
      font-size: 34px;
      color: #e91e63;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #ad1457;
      font-size: 14px;
      margin-bottom: 22px;
      opacity: 0.85;
    }
    .char-select {
      display: flex;
      gap: 16px;
      margin-bottom: 26px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .char-btn {
      width: 86px; height: 86px;
      border-radius: 50%;
      border: 3px solid transparent;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
      box-shadow: 0 5px 16px rgba(233, 30, 99, 0.2);
      pointer-events: auto;
    }
    .char-btn.selected {
      border-color: #e91e63;
      transform: scale(1.12);
      box-shadow: 0 7px 22px rgba(233, 30, 99, 0.4);
    }
    .char-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .char-label {
      font-size: 12px;
      color: #ad1457;
      margin-top: 4px;
      font-weight: 600;
    }
    .char-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: auto;
    }
    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(233, 30, 99, 0.35);
      pointer-events: auto;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .highscore {
      margin-top: 16px;
      color: #ad1457;
      font-size: 13px;
    }
    #hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 22px);
      left: 0; right: 0;
      text-align: center;
      color: #c2185b;
      font-size: 13px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div class="score-box">
        <span id="score">0</span>
        <span id="best">Рекорд: 0</span>
      </div>
    </div>
    <div id="hint">Тапай слева / справа</div>
    <div id="overlay">
      <h1>Скучалка 💕</h1>
      <p class="subtitle">Когда скучно — прыгай выше</p>
      <div class="char-select">
        <div class="char-wrap">
          <div class="char-btn selected" id="btn-girl" data-char="girl">
            <img src="girl.png" alt="Жена" />
          </div>
          <div class="char-label">Жена</div>
        </div>
        <div class="char-wrap">
          <div class="char-btn" id="btn-guy" data-char="guy">
            <img src="guy.png" alt="Муж" />
          </div>
          <div class="char-label">Муж</div>
        </div>
        <div class="char-wrap">
          <div class="char-btn" id="btn-baby" data-char="baby">
            <img src="baby.png" alt="Дочь" />
          </div>
          <div class="char-label">Дочь</div>
        </div>
      </div>
      <button class="btn" id="start-btn">Играть ❤️</button>
      <div class="highscore" id="overlay-best"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayBest = document.getElementById('overlay-best');
    const startBtn = document.getElementById('start-btn');

    let W, H, scale;
    let selectedChar = 'girl';
    let highScore = parseInt(localStorage.getItem('skuchalkaBest') || '0');

    const images = {
      girl: new Image(),
      guy: new Image(),
      baby: new Image()
    };
    images.girl.src = 'girl.png';
    images.guy.src = 'guy.png';
    images.baby.src = 'baby.png';

    const CHAR_COLORS = {
      girl: { body1: '#ff9ecb', body2: '#e91e63', leg: '#ff8fab', border: '#e91e63' },
      guy:  { body1: '#90caf9', body2: '#1565c0', leg: '#5c6bc0', border: '#1565c0' },
      baby: { body1: '#ffe082', body2: '#ffb300', leg: '#ffcc80', border: '#ff8f00' }
    };

    let player, platforms, enemies, cameraY, score, maxHeight, gameRunning, animId;
    let leftPressed = false, rightPressed = false;

    function resize() {
      const container = document.getElementById('game-container');
      const rect = container.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(W / 360, 1.25);
    }

    function createPlayer() {
      return {
        x: W / 2,
        y: H - 150,
        vx: 0,
        vy: 0,
        headR: 21 * scale,
        bodyH: 24 * scale,
        legH: 13 * scale
      };
    }

    function createPlatform(y, isStart = false) {
      const width = isStart ? W * 0.5 : (52 + Math.random() * 58) * scale;
      const isTemp = !isStart && score > 60 && Math.random() < 0.32;
      return {
        x: isStart ? (W - width) / 2 : Math.random() * (W - width),
        y: y,
        width: width,
        height: 12 * scale,
        type: Math.random() < 0.14 ? 'moving' : 'normal',
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: (0.5 + Math.random() * 0.85) * scale,
        temp: isTemp,
        alpha: 1,
        broken: false,
        life: 1
      };
    }

    function createEnemy(y) {
      const others = ['girl', 'guy', 'baby'].filter(c => c !== selectedChar);
      const type = others[Math.floor(Math.random() * others.length)];
      const size = 18 * scale;
      return {
        x: 40 + Math.random() * (W - 80),
        y: y,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.5) * scale,
        type: type,
        headR: size,
        bodyH: size * 1.1,
        legH: size * 0.55,
        alive: true,
        alpha: 1,
        bounce: 0
      };
    }

    function initGame() {
      player = createPlayer();
      platforms = [];
      enemies = [];
      platforms.push(createPlatform(H - 70, true));
      for (let i = 1; i < 14; i++) {
        platforms.push(createPlatform(H - 70 - i * 88 * scale));
      }
      cameraY = 0;
      score = 0;
      maxHeight = 0;
      gameRunning = true;
      leftPressed = false;
      rightPressed = false;
      scoreEl.textContent = '0';
      bestEl.textContent = 'Рекорд: ' + highScore;
    }

    function update() {
      if (!gameRunning) return;

      const moveSpeed = 5.9 * scale;
      if (leftPressed) player.vx = -moveSpeed;
      else if (rightPressed) player.vx = moveSpeed;
      else player.vx *= 0.8;

      player.x += player.vx;
      if (player.x < -30) player.x = W + 30;
      if (player.x > W + 30) player.x = -30;

      player.vy += 0.39 * scale;
      player.y += player.vy;

      const feetY = player.y + player.headR + player.bodyH * 0.55 + player.legH * 0.35;
      if (player.vy > 0) {
        for (let p of platforms) {
          if (p.broken || p.alpha < 0.25) continue;
          if (player.x + player.headR * 0.65 > p.x &&
              player.x - player.headR * 0.65 < p.x + p.width &&
              feetY > p.y &&
              feetY < p.y + p.height + player.vy + 10) {
            player.y = p.y - (player.headR + player.bodyH * 0.55 + player.legH * 0.35);
            player.vy = -12.4 * scale;
            if (p.temp) {
              p.life -= 1;
              if (p.life <= 0) p.broken = true;
            }
            break;
          }
        }
      }

      for (let p of platforms) {
        if (p.type === 'moving' && !p.broken) {
          p.x += p.dir * p.speed;
          if (p.x < 0 || p.x + p.width > W) p.dir *= -1;
        }
        if (p.broken && p.alpha > 0) p.alpha -= 0.045;
      }

      for (let e of enemies) {
        if (!e.alive) {
          e.alpha -= 0.06;
          e.y -= 2 * scale;
          continue;
        }
        e.x += e.vx;
        if (e.x < 20 || e.x > W - 20) e.vx *= -1;
        e.bounce += 0.12;
        e.y += Math.sin(e.bounce) * 0.6;

        const dx = player.x - e.x;
        const dy = (player.y + player.headR) - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = player.headR + e.headR + 4;

        if (dist < minDist && e.alive) {
          if (player.vy > 0 && player.y < e.y - 5) {
            e.alive = false;
            player.vy = -10 * scale;
            score += 15;
            scoreEl.textContent = score;
          } else {
            player.vx = dx > 0 ? 6 * scale : -6 * scale;
            player.vy = -4 * scale;
          }
        }
      }

      const targetCam = player.y - H * 0.42;
      if (targetCam < cameraY) cameraY = targetCam;

      const heightScore = Math.max(0, Math.floor((-player.y + H) / 9));
      if (heightScore > maxHeight) {
        maxHeight = heightScore;
        score = Math.max(score, maxHeight);
        scoreEl.textContent = score;
      }

      let highest = Infinity;
      for (let p of platforms) if (p.y < highest) highest = p.y;

      while (highest - cameraY > -170) {
        const gap = (72 + Math.random() * 58) * scale;
        const newY = highest - gap;
        platforms.push(createPlatform(newY));
        if (score > 40 && Math.random() < 0.22) {
          enemies.push(createEnemy(newY - 40 * scale));
        }
        highest = newY;
        platforms = platforms.filter(p => p.y < cameraY + H + 130 && p.alpha > 0.05);
        enemies = enemies.filter(e => e.y < cameraY + H + 130 && e.alpha > 0.05);
      }

      if (player.y - cameraY > H + 110) gameOver();
    }

    function drawLittlePerson(x, y, type, headR, bodyH, legH, alpha = 1) {
      const img = images[type];
      const colors = CHAR_COLORS[type];
      const bodyW = headR * 1.3;
      const legW = 6.5 * scale;

      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.ellipse(x, y + headR + bodyH + legH + 2, headR * 0.7, 4.5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(233, 30, 99, 0.13)';
      ctx.fill();

      ctx.fillStyle = colors.leg;
      roundRect(x - legW * 1.35, y + headR + bodyH * 0.65, legW, legH, 3);
      ctx.fill();
      roundRect(x + legW * 0.35, y + headR + bodyH * 0.65, legW, legH, 3);
      ctx.fill();

      const grad = ctx.createLinearGradient(x, y + headR, x, y + headR + bodyH);
      grad.addColorStop(0, colors.body1);
      grad.addColorStop(1, colors.body2);
      ctx.fillStyle = grad;
      roundRect(x - bodyW / 2, y + headR * 0.82, bodyW, bodyH, bodyW * 0.35);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(x - bodyW / 2 + 2, y + headR * 0.88, bodyW * 0.32, bodyH * 0.38, 5);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x - headR, y - headR, headR * 2, headR * 2);
      } else {
        ctx.fillStyle = colors.body1;
        ctx.fill();
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.8;
      ctx.stroke();
      ctx.strokeStyle = colors.border;
      ctx.lineWidth = 1.4;
      ctx.stroke();

      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.globalAlpha = 0.06;
      ctx.fillStyle = '#e91e63';
      for (let i = 0; i < 6; i++) {
        const hx = (i * 107 + 25) % W;
        const hy = ((i * 69 + cameraY * 0.22) % (H + 70)) - 35;
        drawHeart(hx, hy, 10 + (i % 3) * 3);
      }
      ctx.globalAlpha = 1;

      for (let p of platforms) {
        const py = p.y - cameraY;
        if (py < -40 || py > H + 40 || p.alpha <= 0) continue;

        ctx.globalAlpha = p.alpha;
        let c1, c2;
        if (p.temp) { c1 = '#ffcc80'; c2 = '#ff8a65'; }
        else if (p.type === 'moving') { c1 = '#ce93d8'; c2 = '#ab47bc'; }
        else { c1 = '#ff8fab'; c2 = '#e91e63'; }

        const grad = ctx.createLinearGradient(p.x, py, p.x, py + p.height);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        roundRect(p.x, py, p.width, p.height, 6);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.32)';
        roundRect(p.x + 2, py + 1, p.width - 4, 3.2, 2);
        ctx.fill();

        if (p.temp && !p.broken) {
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.font = 'bold ' + (11 * scale) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('!', p.x + p.width / 2, py + p.height - 1.5);
        }
        ctx.globalAlpha = 1;
      }

      for (let e of enemies) {
        const ey = e.y - cameraY;
        if (ey < -60 || ey > H + 60) continue;
        drawLittlePerson(e.x, ey, e.type, e.headR, e.bodyH, e.legH, e.alpha);
      }

      const py = player.y - cameraY;
      drawLittlePerson(player.x, py, selectedChar, player.headR, player.bodyH, player.legH);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawHeart(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
      ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
      ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
      ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      if (gameRunning) animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('skuchalkaBest', highScore);
      }
      bestEl.textContent = 'Рекорд: ' + highScore;
      overlayBest.textContent = score > 0 ? 'Результат: ' + score + '  •  Рекорд: ' + highScore : '';
      startBtn.textContent = 'Ещё раз ❤️';
      overlay.classList.remove('hidden');
      cancelAnimationFrame(animId);
    }

    function startGame() {
      overlay.classList.add('hidden');
      initGame();
      loop();
    }

    function setLeft(v) { leftPressed = v; }
    function setRight(v) { rightPressed = v; }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      if (t.clientX - rect.left < W / 2) setLeft(true);
      else setRight(true);
    }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); setLeft(false); setRight(false); }, { passive: false });
    canvas.addEventListener('touchcancel', () => { setLeft(false); setRight(false); });
    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      if (e.clientX - rect.left < W / 2) setLeft(true); else setRight(true);
    });
    window.addEventListener('mouseup', () => { setLeft(false); setRight(false); });
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(true);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(true);
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(false);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(false);
    });

    document.getElementById('btn-girl').addEventListener('click', () => {
      selectedChar = 'girl';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-girl').classList.add('selected');
    });
    document.getElementById('btn-guy').addEventListener('click', () => {
      selectedChar = 'guy';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-guy').classList.add('selected');
    });
    document.getElementById('btn-baby').addEventListener('click', () => {
      selectedChar = 'baby';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-baby').classList.add('selected');
    });

    startBtn.addEventListener('click', startGame);
    window.addEventListener('resize', () => { resize(); if (!gameRunning) draw(); });
    resize();
    bestEl.textContent = 'Рекорд: ' + highScore;
    overlayBest.textContent = highScore > 0 ? 'Лучший результат: ' + highScore : '';
  </script>
</body>
</html>
