<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff9ecb" />
  <title>Doodle Love 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #ffe4f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(180deg, #ffd6e7 0%, #ffe4f0 50%, #fff5f9 100%);
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 14px) 16px 0;
      pointer-events: none;
      z-index: 10;
    }
    .score-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c2185b;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.9);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 230, 242, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    #overlay.hidden { display: none; }
    h1 {
      font-size: 34px;
      color: #e91e63;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #ad1457;
      font-size: 15px;
      margin-bottom: 28px;
      opacity: 0.85;
    }
    .char-select {
      display: flex;
      gap: 24px;
      margin-bottom: 30px;
    }
    .char-btn {
      width: 96px; height: 96px;
      border-radius: 50%;
      border: 4px solid transparent;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
      box-shadow: 0 6px 18px rgba(233, 30, 99, 0.22);
      pointer-events: auto;
    }
    .char-btn.selected {
      border-color: #e91e63;
      transform: scale(1.1);
      box-shadow: 0 8px 24px rgba(233, 30, 99, 0.4);
    }
    .char-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      border: none;
      padding: 15px 42px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(233, 30, 99, 0.35);
      pointer-events: auto;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .highscore {
      margin-top: 20px;
      color: #ad1457;
      font-size: 14px;
    }
    #hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 24px);
      left: 0; right: 0;
      text-align: center;
      color: #c2185b;
      font-size: 13px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div class="score-box">
        <span id="score">0</span>
        <span id="best">Рекорд: 0</span>
      </div>
    </div>
    <div id="hint">Тапай слева / справа, чтобы прыгать</div>
    <div id="overlay">
      <h1>💕 Doodle Love</h1>
      <p class="subtitle">Милая прыгалка только для вас двоих</p>
      <div class="char-select">
        <div class="char-btn selected" id="btn-girl" data-char="girl">
          <img src="girl.png" alt="Она" />
        </div>
        <div class="char-btn" id="btn-guy" data-char="guy">
          <img src="guy.png" alt="Он" />
        </div>
      </div>
      <button class="btn" id="start-btn">Играть ❤️</button>
      <div class="highscore" id="overlay-best"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayBest = document.getElementById('overlay-best');
    const startBtn = document.getElementById('start-btn');
    const btnGirl = document.getElementById('btn-girl');
    const btnGuy = document.getElementById('btn-guy');

    // ===== Settings =====
    let W, H, scale;
    let selectedChar = 'girl';
    let highScore = parseInt(localStorage.getItem('doodleLoveBest') || '0');

    // Images
    const images = {
      girl: new Image(),
      guy: new Image()
    };
    images.girl.src = 'girl.png';
    images.guy.src = 'guy.png';

    // ===== Game state =====
    let player, platforms, cameraY, score, maxHeight, gameRunning, animId;
    let leftPressed = false, rightPressed = false;

    function resize() {
      const container = document.getElementById('game-container');
      const rect = container.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      // Higher internal resolution for sharpness
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(W / 360, 1.3);
    }

    function createPlayer() {
      return {
        x: W / 2,
        y: H - 120,
        vx: 0,
        vy: 0,
        radius: 28 * scale,
        onPlatform: false
      };
    }

    function createPlatform(y, isStart = false) {
      const width = isStart ? W * 0.55 : (60 + Math.random() * 50) * scale;
      return {
        x: isStart ? (W - width) / 2 : Math.random() * (W - width),
        y: y,
        width: width,
        height: 14 * scale,
        type: Math.random() < 0.12 ? 'moving' : 'normal',
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: (0.6 + Math.random() * 0.8) * scale
      };
    }

    function initGame() {
      player = createPlayer();
      platforms = [];
      // Starting platforms
      platforms.push(createPlatform(H - 60, true));
      for (let i = 1; i < 12; i++) {
        platforms.push(createPlatform(H - 60 - i * 95 * scale));
      }
      cameraY = 0;
      score = 0;
      maxHeight = 0;
      gameRunning = true;
      leftPressed = false;
      rightPressed = false;
      scoreEl.textContent = '0';
      bestEl.textContent = 'Рекорд: ' + highScore;
    }

    function update() {
      if (!gameRunning) return;

      // Horizontal movement
      const moveSpeed = 5.5 * scale;
      if (leftPressed) player.vx = -moveSpeed;
      else if (rightPressed) player.vx = moveSpeed;
      else player.vx *= 0.85;

      player.x += player.vx;

      // Wrap around screen
      if (player.x < -player.radius) player.x = W + player.radius;
      if (player.x > W + player.radius) player.x = -player.radius;

      // Gravity
      player.vy += 0.35 * scale;
      player.y += player.vy;

      // Platform collision (only when falling)
      player.onPlatform = false;
      if (player.vy > 0) {
        for (let p of platforms) {
          if (player.x + player.radius * 0.6 > p.x &&
              player.x - player.radius * 0.6 < p.x + p.width &&
              player.y + player.radius > p.y &&
              player.y + player.radius < p.y + p.height + player.vy + 8) {
            player.y = p.y - player.radius;
            player.vy = -11.5 * scale; // jump strength
            player.onPlatform = true;
            break;
          }
        }
      }

      // Move moving platforms
      for (let p of platforms) {
        if (p.type === 'moving') {
          p.x += p.dir * p.speed;
          if (p.x < 0 || p.x + p.width > W) p.dir *= -1;
        }
      }

      // Camera follow (only go up)
      const targetCam = player.y - H * 0.45;
      if (targetCam < cameraY) {
        cameraY = targetCam;
      }

      // Score based on height
      const heightScore = Math.max(0, Math.floor((-player.y + H) / 10));
      if (heightScore > maxHeight) {
        maxHeight = heightScore;
        score = maxHeight;
        scoreEl.textContent = score;
      }

      // Generate new platforms above
      const highest = Math.min(...platforms.map(p => p.y));
      while (highest - cameraY > -200) {
        const newY = highest - (80 + Math.random() * 50) * scale;
        platforms.push(createPlatform(newY));
        // remove old ones
        platforms = platforms.filter(p => p.y < cameraY + H + 100);
        break;
      }

      // Game over
      if (player.y - cameraY > H + 80) {
        gameOver();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Soft background hearts (decorative)
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#e91e63';
      for (let i = 0; i < 8; i++) {
        const hx = (i * 97 + 40) % W;
        const hy = ((i * 73 + cameraY * 0.3) % (H + 100)) - 50;
        drawHeart(hx, hy, 12 + (i % 3) * 4);
      }
      ctx.globalAlpha = 1;

      // Platforms
      for (let p of platforms) {
        const py = p.y - cameraY;
        if (py < -30 || py > H + 30) continue;

        // Platform body
        const grad = ctx.createLinearGradient(p.x, py, p.x, py + p.height);
        grad.addColorStop(0, '#ff8fab');
        grad.addColorStop(1, '#e91e63');
        ctx.fillStyle = grad;
        roundRect(p.x, py, p.width, p.height, 7);
        ctx.fill();

        // Soft top highlight
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        roundRect(p.x + 2, py + 1, p.width - 4, 4, 3);
        ctx.fill();

        // Small heart decoration on some platforms
        if (p.width > 80 * scale) {
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          drawHeart(p.x + p.width / 2, py + p.height / 2 + 1, 5);
        }
      }

      // Player
      const py = player.y - cameraY;
      const img = selectedChar === 'girl' ? images.girl : images.guy;

      // Soft shadow
      ctx.beginPath();
      ctx.ellipse(player.x, py + player.radius + 4, player.radius * 0.7, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(233, 30, 99, 0.18)';
      ctx.fill();

      // Circular face
      ctx.save();
      ctx.beginPath();
      ctx.arc(player.x, py, player.radius, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      if (img.complete && img.naturalWidth) {
        ctx.drawImage(img, player.x - player.radius, py - player.radius, player.radius * 2, player.radius * 2);
      } else {
        // fallback
        ctx.fillStyle = selectedChar === 'girl' ? '#ffb6c1' : '#87ceeb';
        ctx.fill();
      }
      ctx.restore();

      // Cute border
      ctx.beginPath();
      ctx.arc(player.x, py, player.radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.strokeStyle = '#e91e63';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawHeart(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
      ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
      ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
      ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      if (gameRunning) animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('doodleLoveBest', highScore);
      }
      bestEl.textContent = 'Рекорд: ' + highScore;
      overlayBest.textContent = score > 0 ? `Твой результат: ${score}  •  Рекорд: ${highScore}` : '';
      startBtn.textContent = 'Ещё раз ❤️';
      overlay.classList.remove('hidden');
      cancelAnimationFrame(animId);
    }

    function startGame() {
      overlay.classList.add('hidden');
      initGame();
      loop();
    }

    // ===== Controls =====
    function setLeft(v) { leftPressed = v; }
    function setRight(v) { rightPressed = v; }

    // Touch
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      if (x < W / 2) setLeft(true);
      else setRight(true);
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      setLeft(false);
      setRight(false);
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => {
      setLeft(false);
      setRight(false);
    });

    // Mouse (for testing on desktop)
    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < W / 2) setLeft(true);
      else setRight(true);
    });
    window.addEventListener('mouseup', () => {
      setLeft(false);
      setRight(false);
    });

    // Keyboard
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(true);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(true);
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(false);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(false);
    });

    // Character select
    btnGirl.addEventListener('click', () => {
      selectedChar = 'girl';
      btnGirl.classList.add('selected');
      btnGuy.classList.remove('selected');
    });
    btnGuy.addEventListener('click', () => {
      selectedChar = 'guy';
      btnGuy.classList.add('selected');
      btnGirl.classList.remove('selected');
    });

    startBtn.addEventListener('click', startGame);

    // Init
    window.addEventListener('resize', () => {
      resize();
      if (!gameRunning) draw();
    });
    resize();
    bestEl.textContent = 'Рекорд: ' + highScore;
    overlayBest.textContent = highScore > 0 ? `Лучший результат: ${highScore}` : '';
  </script>
</body>
</html>
