<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ff9ecb" />
  <title>Скучалка 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #ffe4f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px;
      margin: 0 auto;
      overflow: hidden;
      background: linear-gradient(180deg, #ffd6e7 0%, #ffe4f0 45%, #fff5f9 100%);
    }
    canvas {
      display: block;
      width: 100%; height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 14px) 16px 0;
      pointer-events: none;
      z-index: 10;
    }
    .score-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c2185b;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.9);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 230, 242, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    #overlay.hidden { display: none; }
    h1 {
      font-size: 36px;
      color: #e91e63;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #ad1457;
      font-size: 15px;
      margin-bottom: 28px;
      opacity: 0.85;
    }
    .char-select {
      display: flex;
      gap: 28px;
      margin-bottom: 30px;
    }
    .char-btn {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 4px solid transparent;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fff;
      box-shadow: 0 6px 18px rgba(233, 30, 99, 0.22);
      pointer-events: auto;
    }
    .char-btn.selected {
      border-color: #e91e63;
      transform: scale(1.1);
      box-shadow: 0 8px 24px rgba(233, 30, 99, 0.4);
    }
    .char-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63);
      color: white;
      border: none;
      padding: 15px 42px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(233, 30, 99, 0.35);
      pointer-events: auto;
      transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .highscore {
      margin-top: 20px;
      color: #ad1457;
      font-size: 14px;
    }
    #hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 24px);
      left: 0; right: 0;
      text-align: center;
      color: #c2185b;
      font-size: 13px;
      opacity: 0.65;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div class="score-box">
        <span id="score">0</span>
        <span id="best">Рекорд: 0</span>
      </div>
    </div>
    <div id="hint">Тапай слева / справа</div>
    <div id="overlay">
      <h1>Скучалка 💕</h1>
      <p class="subtitle">Когда скучно — прыгай выше</p>
      <div class="char-select">
        <div class="char-btn selected" id="btn-girl" data-char="girl">
          <img src="girl.png" alt="Она" id="preview-girl" />
        </div>
        <div class="char-btn" id="btn-guy" data-char="guy">
          <img src="guy.png" alt="Он" id="preview-guy" />
        </div>
      </div>
      <button class="btn" id="start-btn">Играть ❤️</button>
      <div class="highscore" id="overlay-best"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayBest = document.getElementById('overlay-best');
    const startBtn = document.getElementById('start-btn');
    const btnGirl = document.getElementById('btn-girl');
    const btnGuy = document.getElementById('btn-guy');

    let W, H, scale;
    let selectedChar = 'girl';
    let highScore = parseInt(localStorage.getItem('skuchalkaBest') || '0');

    // Images
    const images = { girl: new Image(), guy: new Image() };
    images.girl.src = 'girl.png';
    images.guy.src = 'guy.png';
    images.girl.onerror = () => console.warn('girl.png not found');
    images.guy.onerror = () => console.warn('guy.png not found');

    let player, platforms, cameraY, score, maxHeight, gameRunning, animId;
    let leftPressed = false, rightPressed = false;

    function resize() {
      const container = document.getElementById('game-container');
      const rect = container.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(W / 360, 1.25);
    }

    function createPlayer() {
      return {
        x: W / 2,
        y: H - 140,
        vx: 0,
        vy: 0,
        headR: 22 * scale,
        bodyH: 26 * scale,
        legH: 14 * scale
      };
    }

    function createPlatform(y, isStart = false) {
      const width = isStart ? W * 0.5 : (55 + Math.random() * 55) * scale;
      // After score ~80 some platforms become temporary (disappear after landing)
      const isTemp = !isStart && score > 70 && Math.random() < 0.35;
      return {
        x: isStart ? (W - width) / 2 : Math.random() * (W - width),
        y: y,
        width: width,
        height: 13 * scale,
        type: Math.random() < 0.15 ? 'moving' : 'normal',
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: (0.55 + Math.random() * 0.9) * scale,
        temp: isTemp,          // исчезающая
        alpha: 1,
        broken: false,
        life: 1                 // сколько раз можно прыгнуть
      };
    }

    function initGame() {
      player = createPlayer();
      platforms = [];
      platforms.push(createPlatform(H - 70, true));
      for (let i = 1; i < 14; i++) {
        platforms.push(createPlatform(H - 70 - i * 90 * scale));
      }
      cameraY = 0;
      score = 0;
      maxHeight = 0;
      gameRunning = true;
      leftPressed = false;
      rightPressed = false;
      scoreEl.textContent = '0';
      bestEl.textContent = 'Рекорд: ' + highScore;
    }

    function update() {
      if (!gameRunning) return;

      const moveSpeed = 5.8 * scale;
      if (leftPressed) player.vx = -moveSpeed;
      else if (rightPressed) player.vx = moveSpeed;
      else player.vx *= 0.82;

      player.x += player.vx;

      // Wrap
      if (player.x < -30) player.x = W + 30;
      if (player.x > W + 30) player.x = -30;

      // Gravity
      player.vy += 0.38 * scale;
      player.y += player.vy;

      // Collision with platforms
      const feetY = player.y + player.headR + player.bodyH * 0.55 + player.legH * 0.4;
      if (player.vy > 0) {
        for (let p of platforms) {
          if (p.broken || p.alpha < 0.3) continue;
          if (player.x + player.headR * 0.7 > p.x &&
              player.x - player.headR * 0.7 < p.x + p.width &&
              feetY > p.y &&
              feetY < p.y + p.height + player.vy + 10) {
            
            player.y = p.y - (player.headR + player.bodyH * 0.55 + player.legH * 0.4);
            player.vy = -12.2 * scale;

            // Temporary platforms disappear after landing
            if (p.temp) {
              p.life -= 1;
              if (p.life <= 0) {
                p.broken = true;
              }
            }
            break;
          }
        }
      }

      // Move moving platforms
      for (let p of platforms) {
        if (p.type === 'moving' && !p.broken) {
          p.x += p.dir * p.speed;
          if (p.x < 0 || p.x + p.width > W) p.dir *= -1;
        }
        // Fade out broken platforms
        if (p.broken && p.alpha > 0) {
          p.alpha -= 0.04;
        }
      }

      // Camera
      const targetCam = player.y - H * 0.42;
      if (targetCam < cameraY) cameraY = targetCam;

      // Score
      const heightScore = Math.max(0, Math.floor((-player.y + H) / 9));
      if (heightScore > maxHeight) {
        maxHeight = heightScore;
        score = maxHeight;
        scoreEl.textContent = score;
      }

      // Generate platforms
      let highest = Infinity;
      for (let p of platforms) if (p.y < highest) highest = p.y;

      while (highest - cameraY > -180) {
        const gap = (75 + Math.random() * 55) * scale;
        const newY = highest - gap;
        platforms.push(createPlatform(newY));
        highest = newY;
        // Clean old
        platforms = platforms.filter(p => p.y < cameraY + H + 120 && p.alpha > 0.05);
      }

      // Game over
      if (player.y - cameraY > H + 100) {
        gameOver();
      }
    }

    function drawCharacter(x, y) {
      const img = selectedChar === 'girl' ? images.girl : images.guy;
      const headR = player.headR;
      const bodyW = headR * 1.35;
      const bodyH = player.bodyH;
      const legH = player.legH;
      const legW = 7 * scale;

      // Shadow
      ctx.beginPath();
      ctx.ellipse(x, y + headR + bodyH + legH + 3, headR * 0.75, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(233, 30, 99, 0.15)';
      ctx.fill();

      // Legs
      ctx.fillStyle = selectedChar === 'girl' ? '#ff8fab' : '#5c6bc0';
      // Left leg
      roundRect(x - legW * 1.4, y + headR + bodyH * 0.7, legW, legH, 3);
      ctx.fill();
      // Right leg
      roundRect(x + legW * 0.4, y + headR + bodyH * 0.7, legW, legH, 3);
      ctx.fill();

      // Body
      const bodyGrad = ctx.createLinearGradient(x, y + headR, x, y + headR + bodyH);
      if (selectedChar === 'girl') {
        bodyGrad.addColorStop(0, '#ff9ecb');
        bodyGrad.addColorStop(1, '#e91e63');
      } else {
        bodyGrad.addColorStop(0, '#90caf9');
        bodyGrad.addColorStop(1, '#1565c0');
      }
      ctx.fillStyle = bodyGrad;
      roundRect(x - bodyW / 2, y + headR * 0.85, bodyW, bodyH, bodyW * 0.35);
      ctx.fill();

      // Soft highlight on body
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(x - bodyW / 2 + 3, y + headR * 0.9, bodyW * 0.35, bodyH * 0.4, 6);
      ctx.fill();

      // Head (photo circle)
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x - headR, y - headR, headR * 2, headR * 2);
      } else {
        // fallback colored circle
        ctx.fillStyle = selectedChar === 'girl' ? '#ffb6c1' : '#81d4fa';
        ctx.fill();
      }
      ctx.restore();

      // Head border
      ctx.beginPath();
      ctx.arc(x, y, headR, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = selectedChar === 'girl' ? '#e91e63' : '#1565c0';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Soft floating hearts
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = '#e91e63';
      for (let i = 0; i < 7; i++) {
        const hx = (i * 103 + 30) % W;
        const hy = ((i * 71 + cameraY * 0.25) % (H + 80)) - 40;
        drawHeart(hx, hy, 11 + (i % 3) * 3);
      }
      ctx.globalAlpha = 1;

      // Platforms
      for (let p of platforms) {
        const py = p.y - cameraY;
        if (py < -40 || py > H + 40) continue;
        if (p.alpha <= 0) continue;

        ctx.globalAlpha = p.alpha;

        // Color depends on type
        let c1, c2;
        if (p.temp) {
          // Исчезающие — более светлые / оранжево-розовые
          c1 = '#ffcc80';
          c2 = '#ff8a65';
        } else if (p.type === 'moving') {
          c1 = '#ce93d8';
          c2 = '#ab47bc';
        } else {
          c1 = '#ff8fab';
          c2 = '#e91e63';
        }

        const grad = ctx.createLinearGradient(p.x, py, p.x, py + p.height);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        roundRect(p.x, py, p.width, p.height, 6);
        ctx.fill();

        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        roundRect(p.x + 2, py + 1, p.width - 4, 3.5, 2);
        ctx.fill();

        // Little heart on normal wide platforms
        if (!p.temp && p.width > 70 * scale) {
          ctx.fillStyle = 'rgba(255,255,255,0.45)';
          drawHeart(p.x + p.width / 2, py + p.height / 2 + 0.5, 4.5);
        }

        // Warning icon for temporary
        if (p.temp && !p.broken) {
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.font = `${10 * scale}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText('!', p.x + p.width / 2, py + p.height - 2);
        }

        ctx.globalAlpha = 1;
      }

      // Player
      const py = player.y - cameraY;
      drawCharacter(player.x, py);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawHeart(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y + size * 0.3);
      ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
      ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
      ctx.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
      ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      if (gameRunning) animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      gameRunning = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('skuchalkaBest', highScore);
      }
      bestEl.textContent = 'Рекорд: ' + highScore;
      overlayBest.textContent = score > 0 ? `Результат: ${score}  •  Рекорд: ${highScore}` : '';
      startBtn.textContent = 'Ещё раз ❤️';
      overlay.classList.remove('hidden');
      cancelAnimationFrame(animId);
    }

    function startGame() {
      overlay.classList.add('hidden');
      initGame();
      loop();
    }

    // Controls
    function setLeft(v) { leftPressed = v; }
    function setRight(v) { rightPressed = v; }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const rect = canvas.getBoundingClientRect();
      if (t.clientX - rect.left < W / 2) setLeft(true);
      else setRight(true);
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      setLeft(false); setRight(false);
    }, { passive: false });

    canvas.addEventListener('touchcancel', () => { setLeft(false); setRight(false); });

    canvas.addEventListener('mousedown', e => {
      const rect = canvas.getBoundingClientRect();
      if (e.clientX - rect.left < W / 2) setLeft(true);
      else setRight(true);
    });
    window.addEventListener('mouseup', () => { setLeft(false); setRight(false); });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(true);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(true);
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(false);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(false);
    });

    btnGirl.addEventListener('click', () => {
      selectedChar = 'girl';
      btnGirl.classList.add('selected');
      btnGuy.classList.remove('selected');
    });
    btnGuy.addEventListener('click', () => {
      selectedChar = 'guy';
      btnGuy.classList.add('selected');
      btnGirl.classList.remove('selected');
    });

    startBtn.addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      resize();
      if (!gameRunning) draw();
    });

    resize();
    bestEl.textContent = 'Рекорд: ' + highScore;
    overlayBest.textContent = highScore > 0 ? `Лучший результат: ${highScore}` : '';
  </script>
</body>
</html>
