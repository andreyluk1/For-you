<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Скучалка" />
  <meta name="theme-color" content="#ff9ecb" />
  <title>Скучалка для Каролины 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #ffe4f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #game-container {
      position: relative; width: 100%; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
      background: linear-gradient(180deg, #ffd6e7 0%, #ffe4f0 45%, #fff5f9 100%);
      transition: background 0.8s ease;
    }
    #game-container.night { background: linear-gradient(180deg, #2a1a2e 0%, #3d2a4a 40%, #1a1220 100%); }
    canvas { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; top: 0; left: 0; right: 0;
      padding: max(env(safe-area-inset-top), 12px) 12px 0;
      pointer-events: none; z-index: 10;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .score-box {
      color: #c2185b; font-weight: 700; font-size: 16px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.9);
    }
    #game-container.night .score-box { color: #ffb6d9; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .combo-text {
      color: #e91e63; font-weight: 800; font-size: 14px;
      text-shadow: 0 1px 3px rgba(255,255,255,0.9); opacity: 0; transition: opacity 0.2s;
    }
    .combo-text.show { opacity: 1; }
    #pause-btn {
      pointer-events: auto; background: rgba(233,30,99,0.85); color: #fff; border: none;
      width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer;
      box-shadow: 0 3px 10px rgba(233,30,99,0.35); display: none; align-items: center; justify-content: center;
    }
    #pause-btn.show { display: flex; }
    .panel {
      position: absolute; inset: 0;
      background: rgba(255, 230, 242, 0.97);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; padding: 16px; text-align: center; overflow-y: auto;
    }
    .panel.hidden { display: none !important; }
    #prize, #shop { z-index: 30; }
    #pause-overlay { z-index: 25; }
    h1 { font-size: 24px; color: #e91e63; margin-bottom: 4px; line-height: 1.25; }
    .subtitle { color: #ad1457; font-size: 13px; margin-bottom: 12px; opacity: 0.85; }
    .char-select { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; }
    .char-btn {
      width: 76px; height: 76px; border-radius: 50%; border: 3px solid transparent; overflow: hidden;
      cursor: pointer; transition: all 0.2s; background: #fff;
      box-shadow: 0 4px 14px rgba(233,30,99,0.2); pointer-events: auto;
    }
    .char-btn.selected { border-color: #e91e63; transform: scale(1.08); box-shadow: 0 6px 18px rgba(233,30,99,0.4); }
    .char-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .char-label { font-size: 11px; color: #ad1457; margin-top: 2px; font-weight: 600; }
    .char-record { font-size: 10px; color: #c2185b; opacity: 0.75; }
    .char-wrap { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
    .mode-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .mode-btn, .shop-open-btn {
      background: #fff; border: 2px solid #f8bbd0; color: #ad1457;
      padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer; pointer-events: auto; transition: all 0.15s;
    }
    .mode-btn.active { background: #e91e63; border-color: #e91e63; color: #fff; }
    .shop-open-btn { background: linear-gradient(135deg, #ffe082, #ffb300); border-color: #ffb300; color: #5d4037; }
    .btn {
      background: linear-gradient(135deg, #ff6b9d, #e91e63); color: white; border: none;
      padding: 12px 32px; border-radius: 50px; font-size: 15px; font-weight: 600;
      cursor: pointer; box-shadow: 0 6px 18px rgba(233,30,99,0.35); pointer-events: auto;
      transition: transform 0.15s; margin: 4px;
    }
    .btn:active { transform: scale(0.96); }
    .btn.secondary { background: linear-gradient(135deg, #ce93d8, #ab47bc); }
    .btn.gold { background: linear-gradient(135deg, #ffd54f, #ff8f00); color: #5d4037; }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .highscore { margin-top: 8px; color: #ad1457; font-size: 12px; }
    #hint {
      position: absolute; bottom: max(env(safe-area-inset-bottom), 18px); left: 0; right: 0;
      text-align: center; color: #c2185b; font-size: 12px; opacity: 0.6; pointer-events: none; z-index: 5;
    }
    #game-container.night #hint { color: #ffb6d9; }
    .popup-title { font-size: 22px; color: #e91e63; margin-bottom: 8px; }
    .popup-text { font-size: 14px; color: #ad1457; margin-bottom: 16px; line-height: 1.4; }
    .coins-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #ad1457;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff0f5, #fce4ec);
      border: 2px solid #f48fb1;
      padding: 8px 16px;
      border-radius: 24px;
      box-shadow: 0 3px 10px rgba(233, 30, 99, 0.2);
    }
    .coin-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffcdd2, #f48fb1 50%, #e91e63);
      border: 2px solid #c2185b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(233,30,99,0.3);
    }
    .shop-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 320px;
      margin-bottom: 14px;
    }
    .shop-item {
      background: #fff; border: 2px solid #f8bbd0; border-radius: 14px; padding: 10px 8px;
      cursor: pointer; pointer-events: auto; transition: all 0.15s;
    }
    .shop-item.owned { border-color: #81c784; }
    .shop-item.equipped { border-color: #e91e63; background: #fce4ec; }
    .shop-item .name { font-size: 13px; font-weight: 700; color: #ad1457; }
    .shop-item .price { font-size: 12px; color: #e91e63; margin-top: 4px; font-weight: 700; }
    .shop-item .status { font-size: 11px; color: #66bb6a; margin-top: 2px; }
    .shop-gift {
      grid-column: 1 / -1; background: linear-gradient(135deg, #fff3e0, #ffe0b2);
      border-color: #ffb300;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="ui">
      <div>
        <div class="score-box"><span id="score">0</span></div>
        <div class="score-box" style="font-size:14px;margin-top:4px;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffcdd2,#f48fb1 50%,#e91e63);border:1.5px solid #c2185b;font-size:11px;line-height:18px;text-align:center;color:#fff;">♥</span><span id="run-coins">0</span></div>
        <div class="combo-text" id="combo">Комбо x2!</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div class="score-box"><span id="best">Рекорд: 0</span></div>
        <button id="pause-btn">⏸</button>
      </div>
    </div>
    <div id="hint">Тапай слева / справа</div>

    <div id="overlay" class="panel">
      <h1>Скучалка<br>для Каролины 💕</h1>
      <p class="subtitle">Когда скучно — прыгай выше</p>
      <div class="coins-badge"><span class="coin-icon">♥</span> Монеты: <span id="total-coins">0</span></div>
      <div class="char-select">
        <div class="char-wrap">
          <div class="char-btn selected" id="btn-girl" data-char="girl"><img src="girl.png" alt=""></div>
          <div class="char-label">Жена</div>
          <div class="char-record" id="rec-girl">рекорд: 0</div>
        </div>
        <div class="char-wrap">
          <div class="char-btn" id="btn-guy" data-char="guy"><img src="guy.png" alt=""></div>
          <div class="char-label">Муж</div>
          <div class="char-record" id="rec-guy">рекорд: 0</div>
        </div>
        <div class="char-wrap">
          <div class="char-btn" id="btn-baby" data-char="baby"><img src="baby.png" alt=""></div>
          <div class="char-label">Дочь</div>
          <div class="char-record" id="rec-baby">рекорд: 0</div>
        </div>
      </div>
      <div class="mode-row">
        <button class="mode-btn active" id="mode-day">☀️ День</button>
        <button class="mode-btn" id="mode-night">🌙 Ночь</button>
        <button class="shop-open-btn" id="open-shop">🛒 Магазин</button>
      </div>
      <button class="btn" id="start-btn">Играть ❤️</button>
      <div class="highscore" id="overlay-best"></div>
    </div>

    <div id="shop" class="panel hidden">
      <div class="popup-title">🛒 Магазин</div>
      <div class="coins-badge"><span class="coin-icon">♥</span> Монеты: <span id="shop-coins">0</span></div>
      <div class="shop-grid" id="shop-grid"></div>
      <button class="btn secondary" id="close-shop">Назад</button>
    </div>

    <div id="pause-overlay" class="panel hidden">
      <div class="popup-title">Пауза ⏸</div>
      <p class="popup-text">Игра на паузе</p>
      <button class="btn" id="resume-btn">Продолжить</button>
      <button class="btn secondary" id="menu-btn">В меню</button>
    </div>

    <div id="prize" class="panel hidden">
      <div class="popup-title">🎁 Приз от мужа! 🎁</div>
      <p class="popup-text">У вас подарок 💝<br>Напиши ему — он уже знает 😉</p>
      <button class="btn" id="prize-btn">Ура!</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('overlay');
    const shopEl = document.getElementById('shop');
    const pauseOverlay = document.getElementById('pause-overlay');
    const prizeEl = document.getElementById('prize');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlayBest = document.getElementById('overlay-best');
    const comboEl = document.getElementById('combo');
    const runCoinsEl = document.getElementById('run-coins');
    const totalCoinsEl = document.getElementById('total-coins');
    const shopCoinsEl = document.getElementById('shop-coins');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');

    let W, H, scale;
    let selectedChar = 'girl';
    let preferNight = false;
    let records = {
      girl: parseInt(localStorage.getItem('sk_girl') || '0'),
      guy: parseInt(localStorage.getItem('sk_guy') || '0'),
      baby: parseInt(localStorage.getItem('sk_baby') || '0')
    };
    let totalCoins = parseInt(localStorage.getItem('sk_coins') || '0');
    let ownedSkins = JSON.parse(localStorage.getItem('sk_skins') || '["classic"]');
    let equippedSkin = localStorage.getItem('sk_skin') || 'classic';

    const SKINS = {
      classic: { name: 'Классика', price: 0, body1: null, body2: null },
      gold:    { name: 'Золотой', price: 150, body1: '#ffe082', body2: '#ffb300' },
      mint:    { name: 'Мятный', price: 200, body1: '#b2dfdb', body2: '#26a69a' },
      violet:  { name: 'Фиолет', price: 250, body1: '#e1bee7', body2: '#8e24aa' },
      fire:    { name: 'Огонь', price: 350, body1: '#ffcc80', body2: '#e64a19' },
      ice:     { name: 'Лёд', price: 350, body1: '#b3e5fc', body2: '#0277bd' },
      love:    { name: 'Любовь', price: 500, body1: '#f8bbd0', body2: '#c2185b' }
    };

    const images = { girl: new Image(), guy: new Image(), baby: new Image() };
    images.girl.src = 'girl.png';
    images.guy.src = 'guy.png';
    images.baby.src = 'baby.png';

    const BASE_COLORS = {
      girl: { body1: '#ff9ecb', body2: '#e91e63', leg: '#ff8fab', border: '#e91e63' },
      guy:  { body1: '#90caf9', body2: '#1565c0', leg: '#5c6bc0', border: '#1565c0' },
      baby: { body1: '#ffe082', body2: '#ffb300', leg: '#ffcc80', border: '#ff8f00' }
    };

    function getCharColors(type) {
      const base = BASE_COLORS[type];
      const skin = SKINS[equippedSkin];
      if (!skin || !skin.body1) return base;
      return { body1: skin.body1, body2: skin.body2, leg: skin.body2, border: skin.body2 };
    }

    let player, platforms, enemies, particles, coins, cameraY, score, maxHeight, runCoins;
    let gameRunning = false, paused = false, animId;
    let leftPressed = false, rightPressed = false;
    let lastTime = 0, combo = 0, comboTimer = 0, isNight = false;

    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep(freq, dur, type, vol) {
      if (!audioCtx) return;
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type || 'sine'; o.frequency.value = freq; g.gain.value = vol || 0.08;
        o.connect(g); g.connect(audioCtx.destination); o.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }
    function sfxJump() { beep(520, 0.08, 'sine', 0.06); setTimeout(() => beep(720, 0.06, 'sine', 0.04), 40); }
    function sfxStomp() { beep(180, 0.1, 'square', 0.07); }
    function sfxSuper() { beep(400, 0.1, 'sine', 0.07); setTimeout(() => beep(600, 0.1, 'sine', 0.06), 60); setTimeout(() => beep(900, 0.12, 'sine', 0.05), 120); }
    function sfxCoin() { beep(880, 0.06, 'sine', 0.07); setTimeout(() => beep(1200, 0.08, 'sine', 0.05), 50); }
    function sfxGift() { [523,659,784,1046].forEach((f,i) => setTimeout(() => beep(f, 0.15, 'sine', 0.08), i*100)); }

    function saveCoins() { localStorage.setItem('sk_coins', totalCoins); }
    function saveSkins() {
      localStorage.setItem('sk_skins', JSON.stringify(ownedSkins));
      localStorage.setItem('sk_skin', equippedSkin);
    }

    function updateUI() {
      totalCoinsEl.textContent = totalCoins;
      shopCoinsEl.textContent = totalCoins;
      document.getElementById('rec-girl').textContent = 'рекорд: ' + records.girl;
      document.getElementById('rec-guy').textContent = 'рекорд: ' + records.guy;
      document.getElementById('rec-baby').textContent = 'рекорд: ' + records.baby;
      bestEl.textContent = 'Рекорд: ' + records[selectedChar];
    }

    function renderShop() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      Object.keys(SKINS).forEach(id => {
        const s = SKINS[id];
        const owned = ownedSkins.includes(id);
        const eq = equippedSkin === id;
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned ? ' owned' : '') + (eq ? ' equipped' : '');
        div.innerHTML = '<div class="name">' + s.name + '</div>' +
          (eq ? '<div class="status">✓ Надет</div>' :
           owned ? '<div class="status">Куплено — надеть</div>' :
           '<div class="price">♥ ' + s.price + '</div>');
        div.onclick = () => {
          if (owned) {
            equippedSkin = id;
            saveSkins();
            renderShop();
          } else if (totalCoins >= s.price) {
            totalCoins -= s.price;
            ownedSkins.push(id);
            equippedSkin = id;
            saveCoins(); saveSkins();
            updateUI(); renderShop();
            sfxCoin();
          }
        };
        grid.appendChild(div);
      });
      // Gift from husband
      const gift = document.createElement('div');
      gift.className = 'shop-item shop-gift';
      gift.innerHTML = '<div class="name">🎁 Подарок от мужа</div><div class="price">♥ 1000</div>';
      gift.onclick = () => {
        if (totalCoins >= 1000) {
          totalCoins -= 1000;
          saveCoins();
          updateUI();
          shopEl.classList.add('hidden');
          prizeEl.classList.remove('hidden');
          sfxGift();
        }
      };
      grid.appendChild(gift);
    }

    function resize() {
      const rect = container.getBoundingClientRect();
      W = rect.width; H = rect.height;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scale = Math.min(W / 360, 1.25);
    }

    function createPlayer() {
      return { x: W/2, y: H-150, vx: 0, vy: 0, headR: 21*scale, bodyH: 24*scale, legH: 13*scale };
    }

    function createPlatform(y, isStart) {
      const width = isStart ? W*0.5 : (52 + Math.random()*58)*scale;
      const isTemp = !isStart && score > 60 && Math.random() < 0.28;
      const isSuper = !isStart && !isTemp && Math.random() < 0.07;
      return {
        x: isStart ? (W-width)/2 : Math.random()*(W-width),
        y, width, height: 12*scale,
        type: Math.random() < 0.14 ? 'moving' : 'normal',
        dir: Math.random() < 0.5 ? 1 : -1,
        speed: (0.5 + Math.random()*0.85)*scale,
        temp: isTemp, super: isSuper, alpha: 1, broken: false, life: 1
      };
    }

    function createEnemy(y) {
      const others = ['girl','guy','baby'].filter(c => c !== selectedChar);
      const type = others[Math.floor(Math.random()*others.length)];
      const size = 18*scale;
      return {
        x: 40+Math.random()*(W-80), y,
        vx: (Math.random()<0.5?-1:1)*(1.2+Math.random()*1.5)*scale,
        type, headR: size, bodyH: size*1.1, legH: size*0.55,
        alive: true, alpha: 1, bounce: 0
      };
    }

    function maybeSpawnCoin(p) {
      // Rare coins
      if (Math.random() < 0.09) {
        coins.push({
          x: p.x + p.width/2,
          y: p.y - 18*scale,
          r: 9*scale,
          collected: false,
          bob: Math.random()*10
        });
      }
    }

    function spawnHearts(x, y, n) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x: x+(Math.random()-0.5)*20, y,
          vx: (Math.random()-0.5)*2.5*scale,
          vy: (-1.5-Math.random()*2.5)*scale,
          life: 1, size: (4+Math.random()*5)*scale
        });
      }
    }

    function initGame() {
      player = createPlayer();
      platforms = []; enemies = []; particles = []; coins = [];
      platforms.push(createPlatform(H-70, true));
      for (let i = 1; i < 14; i++) platforms.push(createPlatform(H-70-i*88*scale, false));
      cameraY = 0; score = 0; maxHeight = 0; runCoins = 0;
      combo = 0; comboTimer = 0;
      isNight = preferNight;
      if (isNight) container.classList.add('night'); else container.classList.remove('night');
      gameRunning = true; paused = false;
      leftPressed = false; rightPressed = false;
      lastTime = performance.now();
      scoreEl.textContent = '0';
      runCoinsEl.textContent = '0';
      bestEl.textContent = 'Рекорд: ' + records[selectedChar];
      comboEl.classList.remove('show');
      pauseBtn.classList.add('show');
      prizeEl.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
    }

    function setPaused(v) {
      paused = v;
      if (v) pauseOverlay.classList.remove('hidden');
      else {
        pauseOverlay.classList.add('hidden');
        lastTime = performance.now();
        if (gameRunning) animId = requestAnimationFrame(loop);
      }
    }

    function update(dt) {
      if (!gameRunning || paused) return;

      const moveSpeed = 5.9 * scale;
      if (leftPressed) player.vx = -moveSpeed;
      else if (rightPressed) player.vx = moveSpeed;
      else player.vx *= Math.pow(0.8, dt);

      player.x += player.vx * dt;
      if (player.x < -30) player.x = W + 30;
      if (player.x > W + 30) player.x = -30;

      player.vy += 0.39 * scale * dt;
      player.y += player.vy * dt;

      if (comboTimer > 0) {
        comboTimer -= dt;
        if (comboTimer <= 0) { combo = 0; comboEl.classList.remove('show'); }
      }

      const feetY = player.y + player.headR + player.bodyH * 0.55 + player.legH * 0.35;
      if (player.vy > 0) {
        for (let p of platforms) {
          if (p.broken || p.alpha < 0.25) continue;
          if (player.x + player.headR*0.65 > p.x &&
              player.x - player.headR*0.65 < p.x + p.width &&
              feetY > p.y &&
              feetY < p.y + p.height + Math.abs(player.vy)*dt + 10) {
            player.y = p.y - (player.headR + player.bodyH*0.55 + player.legH*0.35);
            if (p.super) {
              player.vy = -18 * scale;
              sfxSuper();
              spawnHearts(player.x, player.y, 6);
            } else {
              player.vy = -12.4 * scale;
              sfxJump();
              spawnHearts(player.x, player.y + player.headR, 3);
            }
            if (p.temp) { p.life--; if (p.life <= 0) p.broken = true; }
            break;
          }
        }
      }

      for (let p of platforms) {
        if (p.type === 'moving' && !p.broken) {
          p.x += p.dir * p.speed * dt;
          if (p.x < 0 || p.x + p.width > W) p.dir *= -1;
        }
        if (p.broken && p.alpha > 0) p.alpha -= 0.045 * dt;
      }

      // Coins collect
      for (let c of coins) {
        if (c.collected) continue;
        c.bob += 0.12 * dt;
        const cy = c.y + Math.sin(c.bob) * 3;
        const dx = player.x - c.x;
        const dy = (player.y + player.headR) - cy;
        if (Math.sqrt(dx*dx + dy*dy) < player.headR + c.r + 4) {
          c.collected = true;
          runCoins += 1;
          totalCoins += 1;
          saveCoins();
          runCoinsEl.textContent = runCoins;
          totalCoinsEl.textContent = totalCoins;
          sfxCoin();
          spawnHearts(c.x, cy, 2);
        }
      }

      for (let e of enemies) {
        if (!e.alive) {
          e.alpha -= 0.06 * dt; e.y -= 2 * scale * dt; continue;
        }
        e.x += e.vx * dt;
        if (e.x < 20 || e.x > W-20) e.vx *= -1;
        e.bounce += 0.12 * dt;
        e.y += Math.sin(e.bounce) * 0.6 * dt;

        const dx = player.x - e.x, dy = (player.y + player.headR) - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < player.headR + e.headR + 4 && e.alive) {
          if (player.vy > 0 && player.y < e.y - 5) {
            e.alive = false;
            player.vy = -10 * scale;
            combo++; comboTimer = 90;
            let bonus = 15;
            if (combo >= 3) bonus = 50; else if (combo >= 2) bonus = 30;
            score += bonus; scoreEl.textContent = score;
            sfxStomp(); spawnHearts(e.x, e.y, 4);
            if (combo >= 2) {
              comboEl.textContent = 'Комбо x' + combo + '! +' + bonus;
              comboEl.classList.add('show');
            }
          } else {
            player.vx = dx > 0 ? 6*scale : -6*scale;
            player.vy = -4 * scale;
            combo = 0; comboEl.classList.remove('show');
          }
        }
      }

      for (let i = particles.length-1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.vy += 0.08 * scale * dt; pt.life -= 0.025 * dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }

      const targetCam = player.y - H * 0.42;
      if (targetCam < cameraY) cameraY += (targetCam - cameraY) * Math.min(1, 0.25 * dt);

      const heightScore = Math.max(0, Math.floor((-player.y + H) / 9));
      if (heightScore > maxHeight) {
        maxHeight = heightScore;
        score = Math.max(score, maxHeight);
        scoreEl.textContent = score;
      }

      let highest = Infinity;
      for (let p of platforms) if (p.y < highest) highest = p.y;

      while (highest - cameraY > -170) {
        const gap = (72 + Math.random() * 58) * scale;
        const newY = highest - gap;
        const plat = createPlatform(newY, false);
        platforms.push(plat);
        maybeSpawnCoin(plat);
        if (score > 40 && Math.random() < 0.22) enemies.push(createEnemy(newY - 40*scale));
        highest = newY;
        platforms = platforms.filter(p => p.y < cameraY + H + 130 && p.alpha > 0.05);
        enemies = enemies.filter(e => e.y < cameraY + H + 130 && e.alpha > 0.05);
        coins = coins.filter(c => !c.collected && c.y < cameraY + H + 130);
      }

      if (player.y - cameraY > H + 110) gameOver();
    }

    function drawLittlePerson(x, y, type, headR, bodyH, legH, alpha) {
      const img = images[type];
      const colors = getCharColors(type);
      const bodyW = headR * 1.3, legW = 6.5 * scale;
      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.ellipse(x, y + headR + bodyH + legH + 2, headR*0.7, 4.5, 0, 0, Math.PI*2);
      ctx.fillStyle = isNight ? 'rgba(0,0,0,0.25)' : 'rgba(233,30,99,0.13)';
      ctx.fill();

      ctx.fillStyle = colors.leg;
      roundRect(x - legW*1.35, y + headR + bodyH*0.65, legW, legH, 3); ctx.fill();
      roundRect(x + legW*0.35, y + headR + bodyH*0.65, legW, legH, 3); ctx.fill();

      const grad = ctx.createLinearGradient(x, y + headR, x, y + headR + bodyH);
      grad.addColorStop(0, colors.body1); grad.addColorStop(1, colors.body2);
      ctx.fillStyle = grad;
      roundRect(x - bodyW/2, y + headR*0.82, bodyW, bodyH, bodyW*0.35); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(x - bodyW/2 + 2, y + headR*0.88, bodyW*0.32, bodyH*0.38, 5); ctx.fill();

      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, headR, 0, Math.PI*2); ctx.clip();
      if (img.complete && img.naturalWidth > 0) ctx.drawImage(img, x-headR, y-headR, headR*2, headR*2);
      else { ctx.fillStyle = colors.body1; ctx.fill(); }
      ctx.restore();

      ctx.beginPath(); ctx.arc(x, y, headR, 0, Math.PI*2);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.8; ctx.stroke();
      ctx.strokeStyle = colors.border; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function drawHeartShape(x, y, size) {
      ctx.beginPath();
      ctx.moveTo(x, y + size*0.3);
      ctx.bezierCurveTo(x, y, x-size, y, x-size, y+size*0.3);
      ctx.bezierCurveTo(x-size, y+size*0.7, x, y+size*1.1, x, y+size*1.1);
      ctx.bezierCurveTo(x, y+size*1.1, x+size, y+size*0.7, x+size, y+size*0.3);
      ctx.bezierCurveTo(x+size, y, x, y, x, y+size*0.3);
      ctx.fill();
    }

    function drawSpring(px, py, pw, ph) {
      // Coil spring on super platform
      const cx = px + pw/2;
      const top = py - 10*scale;
      ctx.strokeStyle = '#ff8f00';
      ctx.lineWidth = 2.2 * scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        const x = cx + Math.sin(t * Math.PI * 3) * 7 * scale;
        const y = top + t * (py - top + 2);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      // base plate
      ctx.fillStyle = '#ffb300';
      roundRect(cx - 10*scale, py - 3*scale, 20*scale, 5*scale, 2);
      ctx.fill();
    }

    function drawCoin(c) {
      if (c.collected) return;
      const cy = c.y - cameraY + Math.sin(c.bob) * 3;
      const r = c.r;
      // soft glow
      ctx.beginPath();
      ctx.arc(c.x, cy, r + 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(244, 143, 177, 0.35)';
      ctx.fill();
      // circle
      ctx.beginPath();
      ctx.arc(c.x, cy, r, 0, Math.PI*2);
      const g = ctx.createRadialGradient(c.x - r*0.3, cy - r*0.3, 1, c.x, cy, r);
      g.addColorStop(0, '#ffcdd2');
      g.addColorStop(0.5, '#f48fb1');
      g.addColorStop(1, '#e91e63');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = '#c2185b';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      // heart
      ctx.fillStyle = '#fff';
      const hs = r * 0.55;
      const hx = c.x, hy = cy - hs * 0.1;
      ctx.beginPath();
      ctx.moveTo(hx, hy + hs * 0.3);
      ctx.bezierCurveTo(hx, hy, hx - hs, hy, hx - hs, hy + hs * 0.3);
      ctx.bezierCurveTo(hx - hs, hy + hs * 0.7, hx, hy + hs * 1.05, hx, hy + hs * 1.05);
      ctx.bezierCurveTo(hx, hy + hs * 1.05, hx + hs, hy + hs * 0.7, hx + hs, hy + hs * 0.3);
      ctx.bezierCurveTo(hx + hs, hy, hx, hy, hx, hy + hs * 0.3);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      ctx.globalAlpha = isNight ? 0.04 : 0.06;
      ctx.fillStyle = isNight ? '#ff80ab' : '#e91e63';
      for (let i = 0; i < 6; i++) {
        const hx = (i*107+25) % W;
        const hy = ((i*69 + cameraY*0.22) % (H+70)) - 35;
        drawHeartShape(hx, hy, 10+(i%3)*3);
      }
      ctx.globalAlpha = 1;

      for (let p of platforms) {
        const py = p.y - cameraY;
        if (py < -50 || py > H+40 || p.alpha <= 0) continue;
        ctx.globalAlpha = p.alpha;
        let c1, c2;
        if (p.super) { c1 = '#fff176'; c2 = '#ffb300'; }
        else if (p.temp) { c1 = '#ffcc80'; c2 = '#ff8a65'; }
        else if (p.type === 'moving') { c1 = '#ce93d8'; c2 = '#ab47bc'; }
        else { c1 = '#ff8fab'; c2 = '#e91e63'; }

        const grad = ctx.createLinearGradient(p.x, py, p.x, py + p.height);
        grad.addColorStop(0, c1); grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        roundRect(p.x, py, p.width, p.height, 6); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        roundRect(p.x+2, py+1, p.width-4, 3.2, 2); ctx.fill();

        if (p.super && !p.broken) drawSpring(p.x, py, p.width, p.height);
        else if (p.temp && !p.broken) {
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.font = 'bold ' + (11*scale) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('!', p.x + p.width/2, py + p.height - 1.5);
        }
        ctx.globalAlpha = 1;
      }

      for (let c of coins) drawCoin(c);

      for (let e of enemies) {
        const ey = e.y - cameraY;
        if (ey < -60 || ey > H+60) continue;
        drawLittlePerson(e.x, ey, e.type, e.headR, e.bodyH, e.legH, e.alpha);
      }

      for (let pt of particles) {
        ctx.globalAlpha = Math.max(0, pt.life);
        ctx.fillStyle = '#ff4081';
        drawHeartShape(pt.x, pt.y - cameraY, pt.size);
      }
      ctx.globalAlpha = 1;

      drawLittlePerson(player.x, player.y - cameraY, selectedChar, player.headR, player.bodyH, player.legH, 1);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath();
    }

    function loop(now) {
      if (!gameRunning) return;
      if (paused) { draw(); return; }
      const rawDt = (now - lastTime) / 16.67;
      lastTime = now;
      update(Math.min(rawDt, 2.0));
      draw();
      animId = requestAnimationFrame(loop);
    }

    function gameOver() {
      gameRunning = false; paused = false;
      cancelAnimationFrame(animId);
      pauseBtn.classList.remove('show');
      if (score > records[selectedChar]) {
        records[selectedChar] = score;
        localStorage.setItem('sk_' + selectedChar, score);
      }
      updateUI();
      overlayBest.textContent = score > 0 ? 'Результат: ' + score + '  •  Рекорд: ' + records[selectedChar] : '';
      startBtn.textContent = 'Ещё раз ❤️';
      overlay.classList.remove('hidden');
      prizeEl.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
    }

    function startGame() {
      ensureAudio();
      overlay.classList.add('hidden');
      initGame();
      lastTime = performance.now();
      animId = requestAnimationFrame(loop);
    }

    function setLeft(v) { leftPressed = v; }
    function setRight(v) { rightPressed = v; }

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (paused || !gameRunning) return;
      const t = e.touches[0], rect = canvas.getBoundingClientRect();
      if (t.clientX - rect.left < W/2) setLeft(true); else setRight(true);
    }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault(); setLeft(false); setRight(false); }, { passive: false });
    canvas.addEventListener('touchcancel', () => { setLeft(false); setRight(false); });
    canvas.addEventListener('mousedown', e => {
      if (paused || !gameRunning) return;
      const rect = canvas.getBoundingClientRect();
      if (e.clientX - rect.left < W/2) setLeft(true); else setRight(true);
    });
    window.addEventListener('mouseup', () => { setLeft(false); setRight(false); });
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(true);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(true);
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') setLeft(false);
      if (e.key === 'ArrowRight' || e.key === 'd') setRight(false);
    });

    document.getElementById('btn-girl').onclick = () => {
      selectedChar = 'girl';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-girl').classList.add('selected');
      bestEl.textContent = 'Рекорд: ' + records.girl;
    };
    document.getElementById('btn-guy').onclick = () => {
      selectedChar = 'guy';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-guy').classList.add('selected');
      bestEl.textContent = 'Рекорд: ' + records.guy;
    };
    document.getElementById('btn-baby').onclick = () => {
      selectedChar = 'baby';
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('btn-baby').classList.add('selected');
      bestEl.textContent = 'Рекорд: ' + records.baby;
    };

    document.getElementById('mode-day').onclick = () => {
      preferNight = false;
      document.getElementById('mode-day').classList.add('active');
      document.getElementById('mode-night').classList.remove('active');
      container.classList.remove('night');
    };
    document.getElementById('mode-night').onclick = () => {
      preferNight = true;
      document.getElementById('mode-night').classList.add('active');
      document.getElementById('mode-day').classList.remove('active');
      container.classList.add('night');
    };

    document.getElementById('open-shop').onclick = () => {
      updateUI();
      renderShop();
      shopEl.classList.remove('hidden');
    };
    document.getElementById('close-shop').onclick = () => { shopEl.classList.add('hidden'); updateUI(); };

    startBtn.onclick = startGame;
    pauseBtn.onclick = () => { if (gameRunning) setPaused(true); };
    document.getElementById('resume-btn').onclick = () => setPaused(false);
    document.getElementById('menu-btn').onclick = () => {
      gameRunning = false; paused = false;
      cancelAnimationFrame(animId);
      pauseBtn.classList.remove('show');
      pauseOverlay.classList.add('hidden');
      overlay.classList.remove('hidden');
      updateUI();
    };
    document.getElementById('prize-btn').onclick = () => {
      prizeEl.classList.add('hidden');
      updateUI();
    };

    window.addEventListener('resize', () => { resize(); if (!gameRunning) draw(); });
    resize();
    updateUI();
  </script>
</body>
</html>
